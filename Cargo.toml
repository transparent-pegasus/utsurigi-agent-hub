[package]
name = "utsurigi"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
default-run = "utsurigi"

[[bin]]
name = "utsurigi"
path = "src/main.rs"

# Compatibility name: jobs and copied installs that call the pre-0.2.0 command keep working.
[[bin]]
name = "utsurigi-agent-hub"
path = "src/main.rs"
test = false
doc = false

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
bzip2 = "0.6"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.10"
tempfile = "3"
